name: Ticket Watcher (Fast)

# Runs every 5 minutes against sites tagged priority="fast" in sites.py
# (currently TAO). The default 15-min cron in frontgate.yml skips these via
# --priority normal so each site is only scraped on one schedule.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit state changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium

      - name: Run watcher (fast priority sites)
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python watcher.py --priority fast

      - name: Commit state changes
        run: |
          git config user.name "ticket-watcher"
          git config user.email "actions@users.noreply.github.com"
          git config core.autocrlf input
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "state: update event snapshots (fast) [skip ci]"
          STATE_SHA=$(git rev-parse HEAD)

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if git cherry-pick "$STATE_SHA"; then
              :
            else
              echo "[push] attempt $i: cherry-pick conflicted, taking ours"
              git checkout --theirs -- state/ 2>/dev/null || true
              git checkout "$STATE_SHA" -- state/
              git add state/
              git -c core.editor=true cherry-pick --continue || git commit -m "state: update event snapshots (fast) [skip ci]"
            fi

            if git push origin main; then
              echo "[push] state landed on attempt $i"
              exit 0
            fi
            echo "[push] attempt $i: push rejected, retrying"
            sleep $((5 * i))
          done
          echo "[push] exhausted retries — state will retry next cron tick"
          exit 0
