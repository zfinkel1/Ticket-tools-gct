name: Ticket Watcher

on:
  schedule:
    # Every 15 minutes (inside GitHub Actions free tier)
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit state changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium

      - name: Run watcher
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python watcher.py

      - name: Commit state changes
        run: |
          git config user.name "ticket-watcher"
          git config user.email "actions@users.noreply.github.com"
          # Normalize CRLF/LF so cross-platform line endings don't show as
          # spurious changes that block the diff check below.
          git config core.autocrlf input
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          # Stash the staged state changes onto a throwaway branch. We can
          # then reset main to fresh remote and cherry-pick our state commit
          # cleanly each retry — no half-rebased states, no autostash quirks.
          git commit -m "state: update event snapshots [skip ci]"
          STATE_SHA=$(git rev-parse HEAD)

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # Replay our state commit on top of the freshly fetched main.
            # State files don't conflict between runs in practice, but if a
            # cherry-pick conflict ever does happen, take OUR version and move on.
            if git cherry-pick "$STATE_SHA"; then
              :  # clean cherry-pick
            else
              echo "[push] attempt $i: cherry-pick conflicted, taking ours"
              git checkout --theirs -- state/ 2>/dev/null || true
              git checkout "$STATE_SHA" -- state/
              git add state/
              git -c core.editor=true cherry-pick --continue || git commit -m "state: update event snapshots [skip ci]"
            fi

            if git push origin main; then
              echo "[push] state landed on attempt $i"
              exit 0
            fi
            echo "[push] attempt $i: push rejected, retrying"
            sleep $((5 * i))
          done
          echo "[push] exhausted retries — state will retry next cron tick"
          exit 0
