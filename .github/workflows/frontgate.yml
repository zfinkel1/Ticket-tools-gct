name: Ticket Watcher

on:
  schedule:
    # Every 15 minutes (inside GitHub Actions free tier)
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit state changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium

      - name: Run watcher
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python watcher.py

      - name: Commit state changes
        run: |
          git config user.name "ticket-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "state: update event snapshots [skip ci]"
            # Rebase on top of any newer commits (manual code pushes) before pushing.
            # Without this, git push fails with non-fast-forward whenever a code
            # change has landed since the last state commit, and the watcher keeps
            # re-emailing the same "new" events every 15 minutes because state
            # never persists. Retry up to 3 times in case of race conditions.
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                echo "State pushed successfully on attempt $i"
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
